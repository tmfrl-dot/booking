<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>오피스밸리 갱신 안내</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3f6f9; --surface:#ffffff; --line:#d9e1ea; --fg:#14243a; --muted:#5d6e82;
  --navy:#173f7a; --teal:#127a7c; --tealsoft:#e3f2f1; --warn:#a85d00; --warnsoft:#fbf0e0;
  --done:#2f7d46; --donesoft:#e6f3ea;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1722; --surface:#172231; --line:#2a394c; --fg:#e6edf5; --muted:#9aabbf;
  --navy:#8fb4ee; --teal:#5cc4c2; --tealsoft:#163533; --warn:#f0b05a; --warnsoft:#3a2a14;
  --done:#7fcf95; --donesoft:#183220; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font-size:21px;margin:0;color:var(--navy)}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
textarea{width:100%;min-height:110px;resize:vertical;line-height:1.5}
:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
button,.btn{font:inherit;font-weight:600;border-radius:7px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.file{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);cursor:pointer}
.file input{display:none}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--tealsoft);color:var(--teal)}
.tag.warn{background:var(--warnsoft);color:var(--warn)}
.tag.ok{background:var(--donesoft);color:var(--done)}
.summary{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.summary b{font-size:20px;font-variant-numeric:tabular-nums}
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.alldone{border-color:var(--done)}
.head{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.who{font-weight:700;font-size:16px}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.fields input{width:100%}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.step .t{min-width:0;font-size:13.5px}
.step .t b{display:block;font-size:14px}
.step .t span{display:block;color:var(--muted);white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.step.next{border-color:var(--teal);background:var(--tealsoft)}
.step.next .n{background:var(--teal);color:#fff;border-color:var(--teal)}
.step.next .go{background:var(--teal);border-color:var(--teal);color:#fff}
.step.done .n{background:var(--done);border-color:var(--done);color:#fff}
.step.done .t{opacity:.6}
.step .go{padding:8px 12px;white-space:nowrap}
.step .go[aria-disabled="true"]{opacity:.45;pointer-events:none}
.small{display:flex;flex-wrap:wrap;gap:8px}
.small button{font-size:13px;padding:6px 10px;font-weight:500}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
details summary{cursor:pointer;font-weight:600;color:var(--navy)}
.guide img{border-radius:8px;border:1px solid var(--line);display:block;max-width:100%}
.note{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>오피스밸리 갱신 안내 발송</h1>
    <p class="sub">계약 종료 5일 전 고객을 골라, 이미지와 문자 4통을 순서대로 보냅니다.</p>
  </header>

  <section class="panel">
    <div class="row">
      <label for="base">기준일 (오늘)<input type="date" id="base"></label>
      <label for="days">며칠 전 발송<input type="number" id="days" value="5" min="0" max="30" style="width:90px"></label>
      <label style="flex-direction:row;align-items:center;gap:6px;color:var(--fg)"><input type="checkbox" id="late"> 지난 대상(D-4~D-0)도 보기</label>
    </div>
    <label class="file" for="xl">
      <input type="file" id="xl" accept=".xlsx,.xls,.csv">
      <span id="fileLabel">엑셀 파일을 눌러서 선택하세요 · 지금은 예시 3건이 들어 있습니다</span>
    </label>
    <p class="note">엑셀에 연락처(휴대폰) 열이 있으면 자동으로 읽고, 없으면 카드에서 입력하면 됩니다. 엑셀 내용은 이 기기 안에서만 읽고 어디에도 올라가지 않습니다.</p>
  </section>

  <section class="summary" id="summary"></section>
  <section class="cards" id="cards"></section>

  <details class="panel">
    <summary>문자 내용·계좌 설정</summary>
    <label for="acct">입금 계좌<input id="acct" placeholder="예: OO은행 000-0000-0000 (주)보성"></label>
    <p class="note">{업체명} {대표자명} {종료일} {계좌} {금액} 자리는 고객마다 자동으로 채워집니다.</p>
    <div id="tplBox" style="display:flex;flex-direction:column;gap:10px"></div>
    <div class="small"><button id="resetTpl">기본 문구로 되돌리기</button></div>
  </details>

  <details class="panel guide">
    <summary>안내 이미지</summary>
    <p class="note">'이미지 보내기'가 안 되는 폰이라면 아래 이미지를 한 번 저장해두고 문자에 직접 첨부해 주세요.</p>
    <img src="guide.jpg" alt="오피스밸리 공식 연락번호 안내 이미지">
    <div class="small"><a class="btn" href="guide.jpg" download="오피스밸리_안내.jpg">이미지 저장</a></div>
  </details>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const DEFAULT_MSGS=[
`안녕하세요
오피스밸리 직영점 갱신 담당자 입니다.

항상 믿고 함께해주셔서 감사드리며,
계약 기간이 곧 만료되어 안내 해 드립니다`,
`1. 업체명 : {업체명}
2. 임대차계약종료일 : {종료일}`,
`갱신 여부 확인을 위해 연장관련 여부 회신 부탁드리며
갱신을 희망하실 경우 계좌로 납부 부탁드립니다.

변경사항 또는 계약 종료관련 도 회신 부탁드립니다.

** 담당자 연락처
☎ 010-2998-1938 ☎ 010-2412-1938`,
`3. 계좌번호 및 금액
{계좌}
{금액}원`];
const MSG_NAMES=['인사','업체명·종료일','갱신 안내·담당자 연락처','계좌·금액'];

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
const smsHref=(phone,text)=>'sms:'+phone.replace(/[^\d]/g,'')+(isIOS?'&':'?')+'body='+encodeURIComponent(text);
let rows=[], isSample=true;
let prog=store.get('ov_prog',{}), edits=store.get('ov_edits',{});
let msgs=store.get('ov_msgs',DEFAULT_MSGS); if(!Array.isArray(msgs)||msgs.length!==4)msgs=DEFAULT_MSGS.slice();

const SAMPLE=[
 {지점:'가경2호',대표자명:'홍길동',호수:'B173',업체명:'예시상사',상품:'베이직',요금:22000,개월:12,종료:new Date(2026,9,18),연락처:''},
 {지점:'가경2호',대표자명:'김예시',호수:'148',업체명:'샘플컴퍼니',상품:'베이직',요금:22000,개월:12,종료:new Date(2026,9,19),연락처:''},
 {지점:'가경2호',대표자명:'이샘플',호수:'B174',업체명:'주식회사 테스트',상품:'스탠다드',요금:33000,개월:12,종료:new Date(2026,9,23),연락처:''},
];

const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const kdate=d=>d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일';
const num=v=>{if(typeof v==='number')return v;const n=String(v||'').replace(/[^\d.]/g,'');return n?Number(n):0};

function parseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return new Date(v.getFullYear(),v.getMonth(),v.getDate());
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())}
  const s=String(v).trim();
  let m=s.match(/(\d{2,4})\s*[년.\-\/]\s*(\d{1,2})\s*[월.\-\/]\s*(\d{1,2})/);
  if(m){let y=+m[1];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[3])}
  m=s.match(/^(\d{4})(\d{2})(\d{2})$/); if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  return null;
}
const COLS={대표자명:/대표자|성명|이름|고객명/,업체명:/업체|상호|회사/,종료:/종료날짜|종료일자|만료일|계약종료|종료일/,
  요금:/요금|금액|이용료/,개월:/개월/,연락처:/연락처|휴대폰|핸드폰|전화|번호/,호수:/호수|호실/,지점:/지점/,상품:/상품/};
function scoreDate(aoa,hi,col){let n=0;for(let r=hi+1;r<Math.min(aoa.length,hi+30);r++)if(parseDate(aoa[r][col]))n++;return n}
function readSheet(ws){
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const hi=aoa.findIndex(r=>r.some(c=>/대표자|업체/.test(String(c)))&&r.some(c=>/종료/.test(String(c))));
  if(hi<0)throw new Error('제목 줄(대표자명·업체명·종료날짜)을 찾지 못했습니다.');
  const head=aoa[hi].map(c=>String(c).replace(/\s/g,''));
  const idx={};
  for(const k in COLS){
    let c=head.map((h,i)=>COLS[k].test(h)?i:-1).filter(i=>i>=0);
    if(k==='종료')c.sort((a,b)=>scoreDate(aoa,hi,b)-scoreDate(aoa,hi,a));
    if(k==='연락처')c=c.filter(i=>!/호수|호실/.test(head[i]));
    idx[k]=c.length?c[0]:-1;
  }
  const out=[];
  for(let r=hi+1;r<aoa.length;r++){
    const row=aoa[r],g=k=>idx[k]>=0?row[idx[k]]:'';
    const d=parseDate(g('종료'));if(!d||!String(g('대표자명')||g('업체명')).trim())continue;
    out.push({지점:String(g('지점')).trim(),대표자명:String(g('대표자명')).trim(),호수:String(g('호수')).trim(),
      업체명:String(g('업체명')).replace(/\s*\n\s*/g,'').trim(),상품:String(g('상품')).trim(),
      요금:num(g('요금')),개월:num(g('개월'))||12,종료:d,연락처:String(g('연락처')).trim()});
  }
  return out;
}
$('xl').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
    let all=[],err=null;
    for(const n of wb.SheetNames){try{all=all.concat(readSheet(wb.Sheets[n]))}catch(x){err=x}}
    if(!all.length)throw err||new Error('읽을 수 있는 줄이 없습니다.');
    rows=all;isSample=false;$('fileLabel').textContent=f.name+' · '+all.length+'건 불러옴 (다른 파일은 다시 누르기)';render();
  }catch(x){toast(x.message)}
});

const key=r=>r.대표자명+'|'+r.업체명+'|'+iso(r.종료);
const amount=r=>edits[key(r)]?.금액??(r.요금*r.개월);
const phone=r=>edits[key(r)]?.연락처??r.연락처;
const fill=(t,r)=>t.replaceAll('{업체명}',r.업체명).replaceAll('{대표자명}',r.대표자명).replaceAll('{종료일}',kdate(r.종료))
  .replaceAll('{계좌}',$('acct').value||'(계좌 입력 필요)').replaceAll('{금액}',Number(amount(r)||0).toLocaleString('ko-KR'));
const STEPS=5; // 0: 이미지, 1~4: 문자
const getP=k=>prog[k]||[];
function setStep(k,i,on){const p=new Set(getP(k));on?p.add(i):p.delete(i);prog[k]=[...p];store.set('ov_prog',prog)}

let imgFile=null;
async function getImg(){if(imgFile)return imgFile;const b=await (await fetch('guide.jpg')).blob();return imgFile=new File([b],'오피스밸리_안내.jpg',{type:'image/jpeg'})}
async function shareImg(){
  try{
    const f=await getImg();
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return true}
  }catch(e){if(e.name==='AbortError')return false}
  toast('이 기기는 이미지 바로 보내기가 안 됩니다. 아래 안내 이미지를 저장해 첨부해 주세요');return false;
}

function render(){
  const base=parseDate($('base').value)||today(),days=Number($('days').value)||0,late=$('late').checked;
  const list=rows.map(r=>({r,left:Math.round((r.종료-base)/864e5)}))
    .filter(x=>late?(x.left<=days&&x.left>=0):x.left===days).sort((a,b)=>b.left-a.left||a.r.종료-b.r.종료);
  const doneN=list.filter(x=>getP(key(x.r)).length>=STEPS).length;
  $('summary').innerHTML=`<span>발송 대상</span><b>${list.length}명</b><span class="tag ok">완료 ${doneN}</span><span class="tag ${list.length-doneN?'warn':''}">남음 ${list.length-doneN}</span>`+
    (isSample?'<span class="tag warn">예시 데이터</span>':'')+`<span class="meta">${kdate(new Date(base.getTime()+days*864e5))} 종료 대상</span>`;
  const box=$('cards');
  if(!list.length){box.innerHTML=`<div class="panel empty">${kdate(base)} 기준으로 ${days}일 뒤 계약이 끝나는 고객이 없습니다.</div>`;return}
  box.innerHTML='';
  list.forEach(({r,left},ci)=>{
    const k=key(r),p=getP(k),done=p.length>=STEPS;
    const c=document.createElement('article');c.className='card'+(done?' alldone':'');
    c.innerHTML=`<div class="head"><div><div class="who"></div><div class="meta inf"></div></div>
      <span class="tag ${done?'ok':(left===days?'':'warn')}">${done?'보냄':(left===0?'오늘 종료':'D-'+left)}</span></div>
      <div class="fields"><label>연락처<input id="ph-${ci}" inputmode="tel" class="ph" placeholder="010-0000-0000"></label>
      <label>금액(원)<input id="am-${ci}" inputmode="numeric" class="am"></label></div>
      <ol class="steps"></ol>
      <div class="small"><button class="rs">처음부터 다시</button></div>`;
    c.querySelector('.who').textContent=`${ci+1}. ${r.대표자명} · ${r.업체명}`;
    c.querySelector('.inf').textContent=[r.지점,r.호수,r.상품,'종료 '+kdate(r.종료)].filter(Boolean).join(' · ');
    const phI=c.querySelector('.ph'),amI=c.querySelector('.am'),ol=c.querySelector('.steps');
    phI.value=phone(r);amI.value=Number(amount(r)).toLocaleString('ko-KR');
    const draw=()=>{
      const p=getP(k),ph=phone(r).replace(/[^\d]/g,''),ok=ph.length>=10;
      const next=[0,1,2,3,4].find(i=>!p.includes(i));
      ol.innerHTML='';
      for(let i=0;i<STEPS;i++){
        const li=document.createElement('li');li.className='step'+(p.includes(i)?' done':'')+(i===next?' next':'');
        const txt=i===0?'공식 연락번호 안내 이미지':fill(msgs[i-1],r);
        li.innerHTML=`<div class="n">${p.includes(i)?'✓':i+1}</div><div class="t"><b></b><span></span></div>`;
        li.querySelector('b').textContent=i===0?'이미지 보내기':'문자 '+i+' · '+MSG_NAMES[i-1];
        li.querySelector('span').textContent=txt;
        let go;
        if(i===0){go=document.createElement('button');go.textContent=p.includes(0)?'다시':'보내기';
          go.onclick=async()=>{if(phone(r))copyText(phone(r),'번호를 복사했습니다. 공유창에서 문자를 고른 뒤 받는 사람에 붙여넣으세요');const sent=await shareImg();if(sent||confirmLike(go)){setStep(k,0,true);draw();upd()}};}
        else{go=document.createElement('a');go.href=ok?smsHref(ph,txt):'#';go.textContent=p.includes(i)?'다시':'보내기';
          if(!ok)go.setAttribute('aria-disabled','true');
          go.onclick=()=>{setStep(k,i,true);setTimeout(()=>{draw();upd()},300)};}
        go.className+=' btn go';li.appendChild(go);
        li.querySelector('.n').onclick=()=>{setStep(k,i,!p.includes(i));draw();upd()};
        li.querySelector('.n').style.cursor='pointer';li.querySelector('.n').title='눌러서 완료 표시 바꾸기';
        ol.appendChild(li);
      }
    };
    const upd=()=>{const d=getP(k).length>=STEPS;c.classList.toggle('alldone',d);if(d)render()};
    // 공유창에서 '보내기'를 고르지 않고 닫은 경우를 위해, 두 번째 누르면 완료로 처리
    function confirmLike(btn){if(btn.dataset.ask){return true}btn.dataset.ask='1';btn.textContent='보냈으면 한 번 더';return false}
    draw();
    phI.oninput=()=>{edits[k]={...edits[k],연락처:phI.value};store.set('ov_edits',edits);draw()};
    amI.oninput=()=>{edits[k]={...edits[k],금액:num(amI.value)};store.set('ov_edits',edits);draw()};
    c.querySelector('.rs').onclick=()=>{prog[k]=[];store.set('ov_prog',prog);render()};
    box.appendChild(c);
  });
}

function copyText(t,m){const fb=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(m)}catch(e){}ta.remove()};
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>toast(m),fb);else fb()}
let tt;function toast(m){const el=$('toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2600)}

function drawTpl(){
  $('tplBox').innerHTML='';
  msgs.forEach((m,i)=>{const l=document.createElement('label');l.textContent='문자 '+(i+1)+' · '+MSG_NAMES[i];
    const ta=document.createElement('textarea');ta.id='tpl'+i;ta.value=m;ta.oninput=()=>{msgs[i]=ta.value;store.set('ov_msgs',msgs);render()};
    l.appendChild(ta);$('tplBox').appendChild(l)});
}
$('base').value=iso(today());
$('acct').value=store.get('ov_acct','');
['base','days','late'].forEach(id=>$(id).addEventListener('input',render));
$('acct').addEventListener('input',()=>{store.set('ov_acct',$('acct').value);render()});
$('resetTpl').onclick=()=>{msgs=DEFAULT_MSGS.slice();store.set('ov_msgs',msgs);drawTpl();render()};
drawTpl();rows=SAMPLE;render();getImg().catch(()=>{});
</script>
